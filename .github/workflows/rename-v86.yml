name: Rename v8.6 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename ZIP and remove old v8.5
        run: |
          git config user.name "hamzaagsm"
          git config user.email "hamzaagsm@users.noreply.github.com"
          git mv gsmtool-v8.6-source.zip HamzaGSMTool-v8.6.zip
          git rm -f HamzaGSMTool-v8.5.zip
          git commit -m "Rename gsmtool-v8.6-source.zip to HamzaGSMTool-v8.6.zip; remove v8.5"
          git push
